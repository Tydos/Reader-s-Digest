# Topics to discover articles for
interests:
  - artificial intelligence
  - software engineering
  - startups
  - machine learning
  - developer tools
  - product design

# Time window for searches: day | week | month
timeRange: week

# Hacker News (Algolia API)
useHackerNews: true
hnMinPoints: 30
maxPerTopic: 12

# Site-restricted web search
maxPerSource: 6
maxSourcesPerTopic: 6
delaySeconds: 1.0
